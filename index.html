<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
    <title>Boussole</title>
</head>
<body>
    <header><h1>Boussole Compas</h1></header>
    <div class="main-content">
        <div class="compass-container">
            <div class="compass-background"></div>
            <div id="compass-azimut" class="compass-azimut"></div>
            <div class="compass-mask"></div>
            <div id="compass-needle" class="compass-needle"></div>
        </div>
        <div class="angle-display-container">
            <div class="angle-display-background"></div>
            <div id="angle-display" class="angle-display">--°</div>
        </div>
    </div>
    <footer>JLH***2026*** 12Coeur</footer>
    <script src="tourneboussole.js"></script>
    <script>
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (confirm("Ajouter cette page à l'écran d'accueil ?")) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('L\'utilisateur a accepté l\'ajout.');
                    } else {
                        console.log('L\'utilisateur a refusé l\'ajout.');
                    }
                    deferredPrompt = null;
                });
            }
        });
    </script>
</body>
</html>
